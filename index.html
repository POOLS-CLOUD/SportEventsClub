<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sport Events Club</title>
<meta name="description" content="Pools de pádel: elige la tuya y apúntate.">
<meta name="theme-color" content="#13233A">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20108%20108%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%231B3A66%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230A1628%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%22108%22%20height%3D%22108%22%20rx%3D%2224%22%20fill%3D%22url%28%23g%29%22/%3E%3Cpath%20d%3D%22M20%2C80%20C34%2C62%2050%2C52%2070%2C48%22%20stroke%3D%22%23E4FF3A%22%20stroke-opacity%3D%22.35%22%20stroke-width%3D%225%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M26%2C88%20C40%2C72%2054%2C64%2072%2C60%22%20stroke%3D%22%237FB2F0%22%20stroke-opacity%3D%22.45%22%20stroke-width%3D%223.5%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M30%2C68%20C42%2C56%2054%2C50%2066%2C46%22%20stroke%3D%22%23fff%22%20stroke-opacity%3D%22.55%22%20stroke-width%3D%222.5%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%2272%22%20cy%3D%2242%22%20r%3D%2219%22%20fill%3D%22%23E4FF3A%22/%3E%3Cpath%20d%3D%22M58%2C30%20C66%2C37%2066%2C47%2058%2C55%22%20stroke%3D%22%230A1628%22%20stroke-width%3D%223%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M86%2C29%20C78%2C36%2078%2C48%2086%2C55%22%20stroke%3D%22%230A1628%22%20stroke-width%3D%223%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sport Events">
<meta name="application-name" content="Sport Events">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Móvil primero: una columna de 16px de margen que crece hasta 600px en tablet/ordenador.
   Cabecera oscura, tarjetas claras, barra de acción fija abajo respetando la zona segura del iPhone. */
:root{
  --bg:#F0F2EF; --card:#FFFFFF; --mint:#E8EDE8; --ink:#1A1A18; --muted:#6F7069; --line:#DEE1DA;
  --accent:#11427D; --accent-ink:#FFFFFF; --accent-soft:#E3EAF3; --head:#13233A; --head-ink:#F0F2EF; --head-muted:rgba(240,242,239,.72);
  --ok:#3F7A52; --ok-soft:#E2EFE5; --warn:#B0521F; --warn-soft:#F8E9DF;
  --fd:"Plus Jakarta Sans","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --fb:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#111412; --card:#1A1E1B; --mint:#222823; --ink:#ECEFEA; --muted:#9DA39A; --line:#2C332D;
  --accent:#6FA3E6; --accent-ink:#0B1A2E; --accent-soft:#1A2738; --head:#0B1524; --head-ink:#ECEFEA;
  --ok:#7CC492; --ok-soft:#1B2D21; --warn:#F0A070; --warn-soft:#33231A; color-scheme:dark } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden}
.wrap{width:100%;max-width:600px;margin:0 auto;padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar))}
a{color:var(--accent)}

/* cabecera */
header.top{background:var(--head);color:var(--head-ink);padding-top:calc(16px + var(--sat));padding-bottom:22px;position:relative;overflow:hidden}
header.top .wrap{position:relative;z-index:1}
/* portada: fondo difuminado de pista de pádel con focos, dibujado en SVG */
header.top.hero{min-height:calc(190px + var(--sat));display:flex;align-items:flex-end;padding-bottom:26px;
  background:radial-gradient(120% 90% at 85% 30%,#1d3a63 0%,#13233A 55%,#0b1524 100%)}
header.top.hero .wrap{width:100%}
header.top.hero h1{font-size:clamp(30px,9vw,44px);text-shadow:0 2px 18px rgba(0,0,0,.45);max-width:16ch}
header.top.hero .meta{text-shadow:0 1px 8px rgba(0,0,0,.5)}
.heroart{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
header.top:not(.hero) .heroart{display:none}
@media (prefers-reduced-motion: no-preference){
  .heroart .bola{animation:bola 2.6s ease-in-out infinite}
  @keyframes bola{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,3px)}}
}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--head-muted);text-decoration:none;font-size:14px;font-weight:500;min-height:44px;margin:-8px 0 2px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--head-muted);font-weight:600}
h1{font:800 clamp(26px,7.5vw,34px)/1.1 var(--fd);letter-spacing:-.02em;margin:6px 0 4px;text-wrap:balance;overflow-wrap:anywhere}
.meta{color:var(--head-muted);font-size:15px}
.notas{color:var(--head-ink);font-size:14.5px;font-weight:500;white-space:pre-line;margin-top:8px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.08);overflow-wrap:anywhere}
.poolcard .nt{font-size:13.5px;color:var(--ink);margin-top:4px;white-space:pre-line;overflow-wrap:anywhere}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.13);font-variant-numeric:tabular-nums;white-space:nowrap}
.sx{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.17em;flex:none}.sxs{display:inline-flex;gap:1px;margin-right:5px;vertical-align:middle}
.pill.ok{background:var(--ok);color:#fff} .pill.warn{background:var(--warn);color:#fff} .pill.done{background:#7FB2F0;color:#0B1A2E}
.langbtn{position:absolute;top:calc(12px + var(--sat));right:max(16px,var(--sar));z-index:3;border:1px solid rgba(255,255,255,.4);background:rgba(11,21,36,.45);
  color:var(--head-ink);border-radius:999px;padding:6px 12px;min-height:34px;font:700 13px var(--fb);letter-spacing:.06em;cursor:pointer;backdrop-filter:blur(4px)}
.langbtn span{opacity:.5;font-weight:600}
.langbtn b{font-weight:800}
.clublogo{position:absolute;right:max(16px,var(--sar));top:14px;width:112px;height:112px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.45)}
.clublogo[hidden]{display:none}
header.top.conlogo h1,header.top.conlogo .meta,header.top.conlogo .eyebrow{padding-right:128px}
header.top.conlogo:not(.hero) .clublogo{top:34px;width:76px;height:76px}
header.top.conlogo:not(.hero) h1,header.top.conlogo:not(.hero) .meta,header.top.conlogo:not(.hero) .eyebrow{padding-right:90px}
@media (max-width:480px){ .clublogo{width:72px;height:72px;top:36px} header.top.conlogo h1,header.top.conlogo .meta,header.top.conlogo .eyebrow{padding-right:84px} header.top.conlogo:not(.hero) .clublogo{width:60px;height:60px} header.top.conlogo:not(.hero) h1,header.top.conlogo:not(.hero) .meta,header.top.conlogo:not(.hero) .eyebrow{padding-right:72px} }
.poolcard.clubcard{display:flex;gap:14px;align-items:center;padding-right:40px}
.clubline{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);margin:2px 0 4px}
.clubline img{width:20px;height:20px;border-radius:50%;object-fit:cover;background:#fff;flex:none}
.clubchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.clubchip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:inherit;font-weight:600;font-size:13.5px;white-space:nowrap;flex:none}
.clubchip img{width:26px;height:26px;border-radius:50%;object-fit:cover;background:#fff}
.clubcard img,.clubcard .ph{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#fff;flex:none;display:grid;place-items:center;font-size:28px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.langbtn .flag{width:1.35em;height:.9em;vertical-align:-.1em;margin-right:3px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
header.top .back{padding-right:70px}
.sharerow{display:flex;flex-wrap:wrap;gap:8px}
.sharerow .sharebtn{margin-top:14px}
.cardacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cardbtn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 12px var(--fb);cursor:pointer}
.cardbtn:hover{background:var(--mint)}
.cardacts .tgbtn{margin-top:0}
.sharebtn{margin-top:14px;display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:var(--head-ink);
  border-radius:999px;padding:9px 16px;min-height:44px;font:600 15px var(--fb);cursor:pointer}
.sharebtn:active{background:rgba(255,255,255,.22)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.15);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:#7FB2F0;border-radius:99px;transition:width .4s}

main{padding-top:18px;padding-bottom:8px;display:grid;gap:24px}
/* créditos al pie; deja sitio a la barra fija de «Apuntarme» cuando se ve */
.credits{text-align:center;color:var(--muted);font-size:13px;padding-top:20px;padding-bottom:calc(110px + var(--sab))}
.credits b{font-weight:700;color:var(--ink)}
.credits a{display:inline-block;margin-top:6px;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.credits a.adminlink{margin-top:12px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-weight:600;color:var(--ink);background:var(--card)}
main.noBar + .credits{padding-bottom:calc(28px + var(--sab))}
h2{font:700 20px/1.2 var(--fd);letter-spacing:-.01em;margin:0 0 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
h2 small{font:500 13px var(--fb);color:var(--muted)}

/* listado de pools */
.pools{display:grid;gap:10px}
.poolcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:inherit;position:relative}
.poolcard:active{transform:scale(.99)}
.poolcard .t{font:700 17px/1.25 var(--fd);letter-spacing:-.01em;padding-right:24px;overflow-wrap:anywhere}
.poolcard .m{color:var(--muted);font-size:14px;margin-top:2px}
.poolcard .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.poolcard .chev{position:absolute;right:14px;top:16px;color:var(--muted);font-size:20px}
.tag{display:inline-flex;border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:600;background:var(--mint);font-variant-numeric:tabular-nums}
.tag.open{background:var(--ok-soft);color:var(--ok)} .tag.closed{background:var(--warn-soft);color:var(--warn)} .tag.drawn{background:var(--accent-soft);color:var(--accent)}
.mini{height:4px;border-radius:99px;background:var(--mint);margin-top:10px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}

/* lista de apuntados */
.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);min-height:48px}
.list li:first-child{border-top:0}
.n{min-width:1.9em;text-align:right;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.free .nm{color:var(--muted);font-weight:400;font-style:italic}
.conf{color:var(--ok);font-weight:800}
.tgbtn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:7px 12px;border-radius:999px;background:#229ED9;color:#fff;font:700 13px var(--fb);text-decoration:none;cursor:pointer;border:0}
.tgbtn:hover{filter:brightness(1.05)}
.nm .subtag{display:block;margin-top:3px}
.pend{white-space:nowrap;font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:2px 6px;display:inline-block}
.confok{white-space:nowrap;font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:2px 6px;display:inline-block}
.confbtn{display:block;margin-top:5px;border:0;border-radius:8px;padding:7px 12px;font:700 13px var(--fb);background:var(--ok);color:#fff;cursor:pointer}
.nocourt{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:2px 6px;flex:none;white-space:nowrap}
.me{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;flex:none}
.del{border:0;background:transparent;color:var(--warn);font:600 14px var(--fb);padding:10px 4px;min-height:44px;cursor:pointer;flex:none}
.empty{color:var(--muted);font-size:15px;padding:14px}
.moves{list-style:none;margin:0;padding:0;font-size:14.5px;display:grid;gap:8px}
.moves li{display:flex;gap:8px;align-items:baseline}
.moves .tm{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:8px}
.moves .alta b{color:var(--ok)} .moves .baja b{color:var(--warn)}
.note{border-radius:14px;padding:12px 14px;font-size:15px;background:var(--mint)}
.note.warn{background:var(--warn-soft);color:var(--warn)}

/* resultado del sorteo */
.draw{display:grid;gap:10px}
.court{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.court b{display:block;font:700 17px var(--fd);margin-bottom:6px}
.court .pr{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px dashed var(--line)}
.court .pr:first-of-type{border-top:0}
.court .pr span:first-child{color:var(--muted);font-size:13px;font-weight:600;flex:none;min-width:4.8em}
.court .pr span:last-child{font-weight:500;overflow-wrap:anywhere;min-width:0}
@media (min-width:540px){ .draw{grid-template-columns:1fr 1fr} }

footer{color:var(--muted);font-size:13px;text-align:center}

/* parejas fijas: una fila por pareja con dos huecos, uno al lado del otro */
.pairs{display:grid;gap:8px}
.pairrow{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:stretch}
.pairrow .pl{align-self:center;color:var(--muted);font-weight:600;font-size:13px;min-width:2.6em;font-variant-numeric:tabular-nums}
.slot{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:52px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.slot .nm{font-weight:500;overflow-wrap:anywhere;font-size:15px}
.slot.libre{border-style:dashed;color:var(--muted);font-style:italic;font-size:14px}
.slot .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.slot .del{padding:2px 0;min-height:0;font-size:13px}
.slotbtn{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:12px;min-height:52px;font:600 14px var(--fb);cursor:pointer;padding:6px 8px}

/* barra fija inferior */
.actions{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:5;padding-top:10px;padding-bottom:calc(10px + var(--sab))}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 14px;min-height:52px;font:600 16px var(--fb);cursor:pointer;background:var(--mint);color:var(--ink);text-align:center;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.poolcard:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* hojas inferiores */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(10,14,20,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--card);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:20px max(16px,var(--sar)) calc(20px + var(--sab)) max(16px,var(--sal));max-height:90dvh;overflow:auto;overscroll-behavior:contain}
@media (min-width:640px){ .sheet{align-items:center} .panel{border-radius:22px;padding-bottom:20px} }
.panel h3{font:700 22px var(--fd);letter-spacing:-.01em;margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:none;font-size:28px;line-height:1;color:var(--muted);cursor:pointer;min-width:44px;min-height:44px}
.panel p{margin:0 0 14px;color:var(--muted);font-size:15px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field span{font-size:14px;font-weight:600}
/* 16px como mínimo para que el iPhone no haga zoom al escribir */
input[type=text],input[type=tel]{font:16px var(--fb);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;-webkit-appearance:none;appearance:none}
.err{color:var(--warn);font-size:14px;margin:-4px 0 12px;min-height:1px}
.stack{display:grid;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
.loading{color:var(--muted);text-align:center;padding:40px 0}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>

<header class="top" id="top">
  <svg class="heroart" viewBox="0 0 400 220" preserveAspectRatio="xMaxYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="hgVel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b1524" stop-opacity=".85"/><stop offset=".5" stop-color="#0b1524" stop-opacity=".35"/><stop offset="1" stop-color="#0b1524" stop-opacity="0"/></linearGradient>
      <radialGradient id="hgFoco"><stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset=".3" stop-color="#cfe4ff" stop-opacity=".4"/><stop offset="1" stop-color="#7FB2F0" stop-opacity="0"/></radialGradient>
      <radialGradient id="hgLima"><stop offset="0" stop-color="#E4FF3A" stop-opacity=".35"/><stop offset="1" stop-color="#E4FF3A" stop-opacity="0"/></radialGradient>
      <linearGradient id="hgCristal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FB2F0" stop-opacity=".18"/><stop offset="1" stop-color="#7FB2F0" stop-opacity=".03"/></linearGradient>
      <filter id="hgDifu" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.8"/></filter>
    </defs>
    <g filter="url(#hgDifu)">
      <!-- focos del estadio -->
      <circle cx="205" cy="20" r="30" fill="url(#hgFoco)"/>
      <circle cx="368" cy="14" r="26" fill="url(#hgFoco)"/>
      <circle cx="110" cy="28" r="20" fill="url(#hgFoco)" opacity=".7"/>
      <circle cx="290" cy="34" r="16" fill="url(#hgFoco)" opacity=".6"/>
      <!-- reflejo de color en la pista -->

    const slot = pos => {
      const i = porPos.get(pos);
      if (i) return h("div", {class: "slot"}, h("span", {class: "nm"}, ico(pos), i.nombre),
        mine[i.id] ? h("span", {class: "acts"}, h("span", {class: "me"}, T().you), puedeBorrarA(i) ? h("button", {class: "del", type: "button", onclick: () => quitar(i)}, T().removeMe) : null) : null);
      return puede && (!soloReservas || pos >= max) ? h("button", {class: "slotbtn", type: "button", onclick: () => abrirHueco(pos)}, ico(pos), T().joinHere) : h("div", {class: "slot libre"}, ico(pos), T().free);
    };
    const filas = (desde, hasta, pref) => { const r = []; for (let k = desde; k < hasta; k += 2) r.push(h("div", {class: "pairrow"}, h("span", {class: "pl"}, pref + (Math.floor((k - desde) / 2) + 1)), slot(k), slot(k + 1))); return r; };
    main.append(h("section", {}, h("h2", {}, T().pairsTitle, h("small", {}, T().pairsSmall)),
      p.estado === "abierta" ? h("p", {style: "color:var(--muted);font-size:14px;margin:0 2px 10px"}, T().pairsHelp) : null,
      h("div", {class: "pairs"}, filas(0, max, "P"))));
    const maxRes = p.max_reservas ?? 0;
    if (maxRes >= 2) main.append(h("section", {}, h("h2", {}, T().reservePairsTitle, h("small", {}, T().reservePairs)), h("div", {class: "pairs"}, filas(max, max + maxRes - maxRes % 2, "R"))));
  } else {
    const free = [];
    for (let k = lista.length; k < max; k++) free.push(h("li", {class: "free"}, h("span", {class: "n"}, (k + 1) + "."), h("span", {class: "nm"}, T().free)));
    // sin sorteo todavía: solo entran las pistas completas, por orden de inscripción
    const enPistas = Math.floor(lista.length / 4) * 4, fuera = !D.resultados.length && lista.length >= 4 ? lista.slice(enPistas) : [];
    const fila = (i, k) => { const li = row(i, k + 1); if (k >= enPistas && fuera.length) li.insertBefore(h("span", {class: "nocourt"}, T().noCourtTag), li.children[2] || null); return li; };
    main.append(h("section", {}, h("h2", {}, T().list, h("small", {}, T().listSmall)), h("ol", {class: "list"}, lista.map(fila), free),
      fuera.length ? h("div", {class: "note warn", style: "margin-top:10px"}, T().noCourtNow(fuera.length, fuera.map(i => i.nombre).join(", "))) : null));
    main.append(h("section", {}, h("h2", {}, T().reserves, h("small", {}, T().reservesSmall)),
      reservas.length ? h("ol", {class: "list"}, reservas.map((i, k) => row(i, "R" + (k + 1)))) : h("div", {class: "list"}, h("div", {class: "empty"}, T().noReserves))));
  }
  if (D.movimientos.length) main.append(h("section", {}, h("h2", {}, T().moves),
    h("ul", {class: "moves"}, D.movimientos.slice(0, 15).map(m => h("li", {class: m.tipo},
      h("b", {}, m.tipo === "alta" ? "＋" : "－"), h("span", {}, `${m.nombre} ${m.tipo === "alta" ? T().signsUp : T().dropsOut}`), h("span", {class: "tm"}, hora(m.created_at)))))));

  const abierta = p.estado === "abierta" || soloReservas;
  const lleno = soloReservas ? reservas.length >= (p.max_reservas ?? 0) : D.inscritos.length >= max + (p.max_reservas ?? 0);
  const yaApuntado = desdeAqui >= MAX_DISP;
  // con parejas fijas se apunta tocando un hueco: no hace falta la barra de abajo
  $("actions").hidden = !abierta || fijas;
  main.className = "wrap" + (abierta && !fijas ? "" : " noBar");
  $("bJoin").disabled = lleno || yaApuntado;
  $("bJoin").textContent = yaApuntado ? T().twoFromHere : lleno ? T().allFull
    : desdeAqui ? (lista.length >= max || soloReservas ? T().otherReserve : T().other) : lista.length >= max || soloReservas ? T().joinReserve : T().join;
}

/* ---------- compartir el enlace del evento ---------- */
function textoCompartir(p){
  const f = fecha(p.fecha).toLocaleDateString(LOC(), {day: "2-digit", month: "2-digit", year: "numeric"});
  return [p.titulo, `📅 ${f}${p.horario ? " · " + p.horario : ""}`, p.importe, p.club && "📍 " + p.club].filter(Boolean).join("\n");
}
const urlEvento = p => location.origin + location.pathname + (DEMO ? "?demo&pool=" : "?pool=") + p.codigo;
const urlWeb = () => CLUB ? urlClub(CLUB) : location.origin + location.pathname;
async function copiarTexto(t){
  try { await navigator.clipboard.writeText(t); }
  catch(e) { const ta = h("textarea", {}); ta.value = t; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast(T().copied);
}
function compartir(){ const p = POOL; if (p) compartirEnlace(p.titulo, textoCompartir(p) + "\n\n" + T().signUpHere, urlEvento(p), T().shareText); }
function compartirEvento(p){ compartirEnlace(p.titulo, textoCompartir(p) + "\n\n" + T().signUpHere, urlEvento(p), T().shareText); }
function compartirWeb(){ compartirEnlace(CLUB ? CLUB.nombre : T().shareAllTitle, T().shareAllText, urlWeb(), T().shareAllHelp); }
async function compartirEnlace(titulo, texto, url, ayuda){
  if (navigator.share) { try { await navigator.share({title: titulo, text: texto, url}); return; } catch(e) { if (e && e.name === "AbortError") return; } }
  const todo = texto + " " + url;
  const s = h("div", {class: "sheet"}, h("div", {class: "panel", role: "dialog"},
    h("h3", {}, T().shareTitle, h("button", {class: "x", type: "button", "aria-label": T().close, onclick: () => s.remove()}, "×")),
    h("p", {}, ayuda || T().shareText),
    h("div", {class: "stack"},
      h("a", {class: "btn primary", href: "https://wa.me/?text=" + encodeURIComponent(todo), target: "_blank", rel: "noopener", onclick: () => s.remove()}, "📲 WhatsApp"),
      h("button", {class: "btn", type: "button", onclick: async () => {
        try { await navigator.clipboard.writeText(todo); toast(T().copied); }
        catch(e) { const ta = h("textarea", {}); ta.value = todo; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast(T().copied); }
        s.remove(); }}, T().copyLink))));
  s.addEventListener("click", e => { if (e.target === s) s.remove(); });
  document.body.append(s);
}
$("bShare").onclick = compartir;
$("bShareAll").onclick = compartirWeb;
$("bCopyAll").onclick = () => copiarTexto(urlWeb());

/* ---------- apuntarse / borrarse ---------- */
const sheet = $("sJoin");
sheet.addEventListener("click", e => { if (e.target === sheet || e.target.closest("[data-close]")) sheet.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") sheet.hidden = true; });
// ¿Entraría como reserva? (tras el sorteo, lista llena o hueco de reserva en parejas fijas): entonces el teléfono es obligatorio
const entraComoReserva = () => POOL.estado === "sorteada"
  || (POOL.parejas_fijas ? slotElegido != null && slotElegido >= POOL.max_jugadores : partir(POOL, D.inscritos).lista.length >= POOL.max_jugadores);
let telObligatorio = false;
const pideTelefono = () => { telObligatorio = entraComoReserva(); $("fPhoneO").textContent = telObligatorio ? T().phoneReq : T().phoneOpt; $("fPhone").value = ""; return telObligatorio; };
function abrirHueco(pos){
  slotElegido = pos; pideTelefono();
  const max = POOL.max_jugadores, res = pos >= max, n = Math.floor((res ? pos - max : pos) / 2) + 1;
  $("fName").value = ""; $("fErr").textContent = "";
  $("joinHint").textContent = T().pairHint(res, n);
  sheet.hidden = false; setTimeout(() => $("fName").focus(), 60);
}
$("bJoin").onclick = () => {
  slotElegido = null; pideTelefono();
  $("fName").value = ""; $("fErr").textContent = "";   // siempre vacío: cada uno escribe su nombre
  $("joinHint").textContent = POOL.estado === "sorteada" ? T().reservesOnlyNote : D.inscritos.length >= POOL.max_jugadores ? T().listFullHint
    : D.inscritos.some(i => mias()[i.id]) ? T().otherHint : T().hintName;
  sheet.hidden = false; setTimeout(() => $("fName").focus(), 60);
};
$("fName").onkeydown = e => { if (e.key === "Enter") { if (!$("fPhone").value) $("fPhone").focus(); else $("fSend").click(); } };
$("fPhone").onkeydown = e => { if (e.key === "Enter") $("fSend").click(); };
$("fSend").onclick = async () => {
  const nombre = $("fName").value.replace(/\s+/g, " ").trim();
  if (!nombre) { $("fErr").textContent = T().errName; return; }
  const telefono = $("fPhone").value.replace(/[^0-9+]/g, "") || null;
  if ((telObligatorio || telefono) && (telefono || "").length < 6) { $("fErr").textContent = telefono ? T().errPhoneBad : T().errPhone; $("fPhone").focus(); return; }
  $("fSend").disabled = true; $("fSend").textContent = T().signing; $("fErr").textContent = "";
  try {
    const r = await api.apuntarse(POOL, nombre, POOL.parejas_fijas ? slotElegido : null, telefono);
    const m = mias(); m[r.id] = r.token; store.set("mias", m);
    await cargar();
    const pp = partir(POOL, D.inscritos), enLista = pp.lista.findIndex(i => i.id === r.id);
    const pos = enLista >= 0 ? enLista : POOL.max_jugadores + pp.reservas.findIndex(i => i.id === r.id);
    sheet.hidden = true;
    if (POOL.parejas_fijas && slotElegido != null) { const mx = POOL.max_jugadores, rs = slotElegido >= mx; toast(T().donePair(rs, Math.floor((rs ? slotElegido - mx : slotElegido) / 2) + 1)); }
    else toast(pos >= POOL.max_jugadores ? T().doneReserve(pos - POOL.max_jugadores + 1) : T().donePos(pos + 1));
  } catch(e) { $("fErr").textContent = errText(e); }
  $("fSend").disabled = false; $("fSend").textContent = T().join;
};
function confirmar(texto, si){
  return new Promise(res => {
    const s = h("div", {class: "sheet"}, h("div", {class: "panel", role: "dialog"}, h("h3", {}, T().sure), h("p", {}, texto),
      h("div", {class: "stack"},
        h("button", {class: "btn primary", type: "button", onclick: () => { s.remove(); res(true); }}, si),
        h("button", {class: "btn", type: "button", onclick: () => { s.remove(); res(false); }}, T().cancel))));
    document.body.append(s);
  });
}
async function confirmarPlaza(i){
  try {
    const ok = await api.confirmarPlaza(i.id, mias()[i.id]);
    toast(ok ? T().confirmedToast : T().notThere); await cargar();
  } catch(e) { toast(errText(e)); }
}
async function quitar(i){
  if (!await confirmar(T().confirmRemove(i.nombre), T().yesRemove)) return;
  try {
    const ok = await api.borrarse(i.id, mias()[i.id]);
    const m = mias(); delete m[i.id]; store.set("mias", m);
    toast(ok ? T().removed : T().notThere); await cargar();
  } catch(e) { toast(errText(e)); }
}

/* ---------- arranque ---------- */
let api = null;
try { localStorage.removeItem("pool.yo"); } catch(e) {}
async function cargar(){ D = await api.datos(POOL); vistaPool(); }
async function start(){
  textosFijos();
  if (!DEMO && !window.supabase) { $("title").textContent = T().loadError; $("main").replaceChildren(h("div", {class: "note warn"}, errText("red"))); return; }
  api = DEMO ? demoBackend() : supabaseBackend();
  try {
    // la dirección principal no lista nada: es el acceso de responsables y gestores (la Manager)
    if (!CODIGO && !CLUB_SLUG && !DEMO) { location.replace("manager/"); return; }
    if (!CODIGO && CLUB_SLUG) {
      CLUB = await api.club("slug", CLUB_SLUG);
      if (!CLUB) { $("title").textContent = T().clubNoTitle; $("main").replaceChildren(h("div", {class: "note"}, T().clubNotFound, null)); return; }
    }
    if (!CODIGO) {
      await vistaListado();
      let t = null;
      const refrescar = () => { clearTimeout(t); t = setTimeout(() => vistaListado().catch(() => {}), 300); };
      api.escucharListado(refrescar);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) refrescar(); });
      return;
    }
    POOL = await api.pool(CODIGO);
    if (POOL) { CLUB = await api.club("id", POOL.club_id); if (!CLUB) POOL = null; }
    if (!POOL) {
      $("back").hidden = false; $("title").textContent = T().notFound;
      $("main").replaceChildren(h("div", {class: "note"}, T().invalidLink, null));
      return;
    }
    await cargar();
    let t = null;
    const refrescar = async () => {
      const p = await api.pool(POOL.codigo);
      if (!p) { vistaBorrada(); return; }
      POOL = p; await cargar();
    };
    api.escuchar(POOL, () => { clearTimeout(t); t = setTimeout(() => refrescar().catch(() => {}), 250); });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refrescar().catch(() => {}); });
  } catch(e) {
    $("title").textContent = T().loadError;
    $("main").replaceChildren(h("div", {class: "note warn"}, errText(e)));
  }
}
// Cambiar de idioma: se guarda y se vuelve a pintar la pantalla actual
$("bLang").onclick = () => {
  LANG = LANG === "es" ? "en" : "es";
  try { localStorage.setItem("pool.lang", JSON.stringify(LANG)); } catch(e) {}
  textosFijos();
  if (!CODIGO) vistaListado().catch(() => {}); else if (POOL) vistaPool();
};
start();
</script>
